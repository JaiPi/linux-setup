---
- name: Ensure SSH key exists for cloning private repo
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.ssh/{{ key_file_name }}"
  register: stow_ssh_key
  changed_when: false

- name: Warn if no SSH key is found
  ansible.builtin.debug:
    msg: "⚠️  No SSH key found: {{ ansible_env.HOME }}/.ssh/{{ key_file_name }}"
  when: not stow_ssh_key.stat.exists

- name: "Check if the dotfiles directory already exists: {{ dest_name }}"
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ dest_name }}"
  register: stow_dir
  changed_when: false

- name: "Clone the dotfiles repo: {{ repo }}"
  ansible.builtin.git:
    repo: "{{ repo }}"
    dest: "{{ ansible_env.HOME }}/{{ dest_name }}"
    version: "{{ version }}"
    key_file: "{{ ansible_env.HOME }}/.ssh/{{ key_file_name }}"
    accept_hostkey: yes
  when: stow_ssh_key.stat.exists and not stow_dir.stat.exists

- name: Ensure ~/.ssh is a real directory, so stow links only files into it
  # Without it, stow would link the whole ~/.ssh into the public dotfiles repo, and keys
  # created later would land there.
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Run Stow
  ansible.builtin.command:
    cmd: stow -d {{ ansible_env.HOME }}/{{ dest_name }} -t {{ ansible_env.HOME }} {{ item }}
  with_items: "{{ stow_dirs }}"
  when: stow_dirs is defined
  changed_when: false
