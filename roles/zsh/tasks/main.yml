---
- name: Install Zsh
  ansible.builtin.package:
    name: zsh
    state: present
  when: ansible_facts['os_family'] in ["Debian", "RedHat"] and system_packages is defined
  become: true

- name: Clone Zinit
  ansible.builtin.git:
    repo: https://github.com/zdharma-continuum/zinit.git
    dest: "{{ ansible_env.HOME }}/.local/share/zinit/zinit.git"

- name: Install Starship
  ansible.builtin.include_tasks: starship.yml

- name: Change default shell to Zsh
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    shell: /bin/zsh
  become: true
